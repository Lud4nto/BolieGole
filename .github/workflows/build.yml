name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Capacitor Setup
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch MainActivity for Autoplay
        run: |
          mkdir -p android/app/src/main/java/com/boliegole/app
          cat > android/app/src/main/java/com/boliegole/app/MainActivity.java << 'JAVA_EOF'
          package com.boliegole.app;

          import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.webkit.WebSettings;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebSettings settings = this.bridge.getWebView().getSettings();
                  settings.setMediaPlaybackRequiresUserGesture(false);
              }
          }
          JAVA_EOF

      - name: Generate App Icons
        run: |
          npx capacitor-assets generate --android

      # DÜZELTME: sed yerine Node ile güvenli XML düzenleme
      - name: Force Fullscreen and Landscape
        run: |
          node -e "
            const fs = require('fs');
            // 1) Fullscreen ekle
            const stylesPath = 'android/app/src/main/res/values/styles.xml';
            if (fs.existsSync(stylesPath)) {
              let s = fs.readFileSync(stylesPath, 'utf8');
              if (!s.includes('android:windowFullscreen')) {
                s = s.replace(
                  /<item name=\"windowNoTitle\">true<\/item>/,
                  '<item name=\"windowNoTitle\">true</item><item name=\"android:windowFullscreen\">true</item>'
                );
                fs.writeFileSync(stylesPath, s);
                console.log('Fullscreen OK');
              } else { console.log('Fullscreen zaten var'); }
            } else { console.log('styles.xml bulunamadı'); }

            // 2) Landscape zorla
            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
            if (fs.existsSync(manifestPath)) {
              let m = fs.readFileSync(manifestPath, 'utf8');
              if (!m.includes('android:screenOrientation=\"sensorLandscape\"')) {
                if (m.includes('android:screenOrientation=\"portrait\"')) {
                  m = m.replace(/android:screenOrientation=\"portrait\"/, 'android:screenOrientation=\"sensorLandscape\"');
                } else {
                  // Activity tag'ine ekle
                  m = m.replace(/<activity/, '<activity android:screenOrientation=\"sensorLandscape\"');
                }
                fs.writeFileSync(manifestPath, m);
                console.log('Landscape OK');
              } else { console.log('Landscape zaten var'); }
            } else { console.log('AndroidManifest.xml bulunamadı'); }
          "

      # DÜZELTME: www/manifest.json yoksa kopyala (Capacitor webDir kontrolü)
      - name: Ensure manifest.json in www
        run: |
          if [ ! -f www/manifest.json ] && [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
            echo "manifest.json www/ içine kopyalandı"
          else
            echo "manifest.json zaten www/ içinde veya kaynak yok"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BolieGole.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BolieGole-APK
          path: android/app/build/outputs/apk/debug/BolieGole.apk
