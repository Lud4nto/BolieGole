name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Capacitor Setup
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          npx capacitor-assets generate --android

      # YENİ EKLENEN KISIM: TAM EKRAN VE YATAY EKRAN ZORLAMA
      - name: Force Fullscreen and Landscape
        run: |
          # Durum çubuğunu gizle (Tam Ekran)
          sed -i 's|<item name="windowNoTitle">true</item>|<item name="windowNoTitle">true</item><item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml
          # Ekranı yatay moda zorla
          sed -i 's|android:screenOrientation="portrait"|android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BolieGole-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
