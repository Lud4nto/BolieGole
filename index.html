<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BolieGole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body { margin: 0; padding: 0; background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
        
        #orientation-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f172a; color: white; z-index: 99999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-size: 24px; font-weight: bold; padding: 20px;
        }
        #orientation-warning svg { width: 100px; height: 100px; margin-bottom: 20px; animation: rotateAnim 2s infinite ease-in-out; }
        @keyframes rotateAnim { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
        
        @media (orientation: portrait) and (pointer: coarse) {
            #orientation-warning { display: flex; }
            .screen, #modal-name, #modal-create { display: none !important; }
        }

        .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .active { display: flex; }

        .bg-image { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url('menu.png'); background-size: cover; background-position: center; z-index: -2; }
        .bg-blur { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url('menu.png'); background-size: cover; background-position: center; filter: blur(8px); z-index: -1; opacity: 0.8; }

        .menu-btn { width: 320px; padding: 15px; background-color: #d4a373; border: 4px solid #8b5a2b; box-shadow: 4px 4px 0px #5a3a1b; border-radius: 8px; font-family: 'Press Start 2P', cursive; font-size: 24px; color: #2b1b0e; cursor: pointer; text-align: center; text-transform: uppercase; transition: all 0.1s ease; }
        .menu-btn:hover { background-color: #e0b88e; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #5a3a1b; }
        .menu-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #5a3a1b; }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 180px; }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(4px); }
        .modal-content { background-color: #d4a373; border: 6px solid #8b5a2b; box-shadow: 8px 8px 0px #5a3a1b; border-radius: 12px; padding: 30px; width: 400px; display: flex; flex-direction: column; gap: 15px; color: #2b1b0e; }
        .modal-content h2 { font-family: 'Press Start 2P', cursive; font-size: 20px; text-align: center; margin-top: 0; }
        .modal-content input[type="text"], .modal-content input[type="password"] { padding: 12px; border-radius: 6px; border: 3px solid #8b5a2b; background: #fefae0; color: #2b1b0e; font-size: 16px; font-weight: bold; }
        .radio-group { display: flex; gap: 20px; font-weight: bold; font-size: 14px; justify-content: center; }
        .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: #ef4444; border: 3px solid #991b1b; box-shadow: 3px 3px 0px #7f1d1d; color: white; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 6px; flex: 1; }
        .btn-confirm { background: #22c55e; border: 3px solid #166534; box-shadow: 3px 3px 0px #14532d; color: white; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 6px; flex: 1; }

        .list-container { width: 80%; max-width: 800px; height: 55vh; background: rgba(212, 163, 115, 0.9); border: 6px solid #8b5a2b; box-shadow: 8px 8px 0px #5a3a1b; border-radius: 12px; padding: 20px; overflow-y: auto; position: relative; color: #2b1b0e; }
        .top-bar { width: 80%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-family: 'Press Start 2P', cursive; font-size: 20px; color: #fff; text-shadow: 2px 2px 0px #000; }
        .create-btn { background: #22c55e; border: 4px solid #166534; box-shadow: 4px 4px 0px #14532d; color: white; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 8px; font-family: 'Press Start 2P', cursive; font-size: 14px; transition: 0.1s; }
        .create-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #14532d; }
        
        .server-item { background: #fefae0; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 3px solid #8b5a2b; }
        .server-item h3 { margin: 0; font-size: 18px; color: #2b1b0e; }
        .server-item span { font-size: 12px; font-weight: bold; color: #8b5a2b; }
        .join-btn { background: #4c9aff; border: 3px solid #2563eb; box-shadow: 3px 3px 0px #1e3a8a; color: white; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .join-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #1e3a8a; }

        #screen-lobby { background-color: transparent; }
        .lobby-header { text-align: center; margin-bottom: 30px; z-index: 10; }
        .room-code { font-family: 'Press Start 2P', cursive; font-size: 30px; font-weight: bold; color: #eab308; letter-spacing: 5px; text-shadow: 0 0 10px #eab308; background: #000; padding: 10px 20px; border-radius: 8px; border: 3px solid #eab308; display: inline-block; margin-top: 10px; }
        
        .teams-container { display: flex; gap: 20px; z-index: 10; }
        .team-box { width: 250px; height: 350px; background: rgba(15, 23, 42, 0.9); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; border: 4px solid transparent; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .team-box.red { border-color: #ff4c4c; background: rgba(255, 76, 76, 0.2); }
        .team-box.blue { border-color: #4c9aff; background: rgba(76, 154, 255, 0.2); }
        .team-box.spectator { border-color: #64748b; background: rgba(100, 116, 139, 0.2); }
        .team-box:hover { transform: scale(1.02); }
        .team-title { font-family: 'Press Start 2P', cursive; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .player-slot { width: 100%; padding: 8px; background: rgba(0,0,0,0.5); border-radius: 6px; margin-bottom: 8px; text-align: center; font-weight: bold; color: white; font-size: 14px; }
        
        .start-game-btn { margin-top: 20px; padding: 12px 30px; font-size: 20px; font-weight: bold; background: #eab308; color: #000; border: 4px solid #a16207; box-shadow: 4px 4px 0px #713f12; border-radius: 8px; cursor: pointer; display: none; font-family: 'Press Start 2P', cursive; transition: 0.1s; z-index: 10; }
        .start-game-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #713f12; }

        #screen-game { background: #000; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 1000; }
        #screen-game.active { display: flex; align-items: center; justify-content: center; }
        
        #game-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; object-fit: contain; background-color: #111; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        #in-game-menu-btn { position: absolute; top: 15px; left: 15px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%); color: #2b1b0e; padding: 8px 16px; border-radius: 30px; font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid #fff; }
        
        #scoreboard { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-family: 'Press Start 2P', cursive; font-size: 24px; font-weight: 900; text-shadow: 2px 2px 0px #000; white-space: nowrap; }
        .red-team { color: #ff4c4c; }
        .blue-team { color: #4c9aff; }
        
        .ui-bars { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 5px; align-items: center; }
        #stamina-container { width: 250px; height: 18px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; overflow: hidden; display: flex; align-items: center; backdrop-filter: blur(10px); }
        #stamina-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #eab308); transition: width 0.1s linear; }
        #stamina-text { position: absolute; width: 250px; text-align: center; font-size: 10px; font-weight: 900; color: #fff; text-shadow: 1px 1px 2px #000; }
        #power-container { width: 250px; height: 12px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; overflow: hidden; display: none; align-items: center; }
        #power-bar { height: 100%; width: 0%; background: #ef4444; transition: width 0.05s linear; }
        #power-text { position: absolute; width: 250px; text-align: center; font-size: 8px; font-weight: 900; color: #fff; }

        #mobile-controls { position: absolute; bottom: 20px; right: 20px; display: none; gap: 15px; align-items: flex-end; pointer-events: auto; }
        .mob-btn { width: 75px; height: 75px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 15px rgba(0,0,0,0.5); border: 3px solid rgba(255,255,255,0.2); transition: transform 0.1s; pointer-events: auto; }
        .mob-btn:active { transform: scale(0.9); }
        .mob-btn svg { width: 55%; height: 55%; }
        #btn-sprint { background: #1d4ed8; } 
        #btn-tackle { background: #dc2626; } 
        #btn-action { background: #059669; } 

        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 130px; height: 130px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; display: none; backdrop-filter: blur(5px); pointer-events: auto; }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(76, 154, 255, 0.6); border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(76, 154, 255, 0.5); }

        #pc-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: auto; }
        .key-row { display: flex; gap: 10px; }
        .key { width: 50px; height: 50px; background: rgba(30, 41, 59, 0.6); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #94a3b8; transition: 0.1s; }
        .key.active { background: rgba(76, 154, 255, 0.9); color: white; transform: translateY(4px); }
        .key.disabled { opacity: 0.3; background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .wide-key { width: 110px; }

        @media (pointer: coarse) {
            #mobile-controls, #joystick-zone { display: flex; }
            #pc-controls { display: none; }
            #in-game-menu-btn { font-size: 14px; padding: 6px 12px; }
            #scoreboard { font-size: 18px; }
            .ui-bars { top: 45px; }
            .menu-btn { width: 260px; padding: 10px; font-size: 18px; }
            .modal-content { width: 80%; padding: 15px; gap: 10px; }
            .modal-content h2 { font-size: 16px; }
            .list-container { width: 90%; height: 60vh; }
            .top-bar { width: 90%; font-size: 16px; flex-direction: column; gap: 10px; }
            .create-btn { font-size: 12px; padding: 8px 15px; }
            .server-item { padding: 10px; }
            .lobby-header { margin-bottom: 15px; }
            .room-code { font-size: 20px; padding: 5px 10px; }
            .teams-container { gap: 10px; }
            .team-box { width: 30%; height: 200px; padding: 10px; }
            .team-title { font-size: 12px; margin-bottom: 5px; }
            .player-slot { padding: 5px; font-size: 11px; margin-bottom: 5px; }
            .start-game-btn { margin-top: 10px; padding: 8px 20px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <svg viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="25" y="25" width="50" height="50" rx="5" />
            <path d="M 75 50 L 95 50 M 85 40 L 95 50 L 85 60" />
        </svg>
        <p>En iyi deneyim için lütfen telefonunuzu yatay çevirin.</p>
    </div>

    <div id="screen-main-menu" class="screen active">
        <div class="bg-image"></div>
        <div class="menu-buttons">
            <button class="menu-btn" id="btn-play">OYNA</button>
            <button class="menu-btn" id="btn-options">AYARLAR</button>
            <button class="menu-btn" id="btn-credits">YAPIMCILAR</button>
            <button class="menu-btn" id="btn-exit">ÇIKIŞ</button>
        </div>
    </div>

    <div id="modal-name" class="modal-overlay">
        <div class="modal-content">
            <h2>OYUNCU ADI</h2>
            <input type="text" id="input-player-name" placeholder="İsmini yaz..." maxlength="15">
            <div class="modal-actions">
                <button class="btn-confirm" id="btn-confirm-name" style="width: 100%;">DEVAM ET</button>
            </div>
        </div>
    </div>

    <div id="screen-server-list" class="screen">
        <div class="bg-blur"></div>
        <div class="top-bar">
            <span>SUNUCULAR</span>
            <button class="create-btn" id="btn-show-create">SUNUCU OLUŞTUR</button>
        </div>
        <div class="list-container" id="server-list-container"></div>
        <button class="menu-btn" style="margin-top:15px; width:150px; font-size:14px; padding:8px;" id="btn-back-main">GERİ DÖN</button>
    </div>

    <div id="modal-create" class="modal-overlay">
        <div class="modal-content">
            <h2>SUNUCU OLUŞTUR</h2>
            <input type="text" id="input-room-name" placeholder="Sunucu Adı">
            <div class="radio-group">
                <label><input type="radio" name="room-type" value="private" checked> Özel (Kodlu)</label>
                <label><input type="radio" name="room-type" value="community"> Topluluk</label>
            </div>
            <input type="password" id="input-room-pass" placeholder="Şifre (İsteğe Bağlı)" style="display:none;">
            <div class="modal-actions">
                <button class="btn-cancel" id="btn-cancel-create">İPTAL</button>
                <button class="btn-confirm" id="btn-confirm-create">OLUŞTUR</button>
            </div>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <div class="bg-blur" style="opacity: 0.95;"></div>
        <div class="lobby-header">
            <h2 id="lobby-room-name" style="font-family: 'Press Start 2P', cursive; font-size: 20px; color: white; text-shadow: 2px 2px 0 #000;">Oda Adı</h2>
            <div class="room-code" id="lobby-room-code" style="display:none;">KOD: ---</div>
        </div>
        <div class="teams-container">
            <div class="team-box red" onclick="selectTeam('red')">
                <div class="team-title" style="color:#ff4c4c;">KIRMIZI</div>
                <div id="red-players"></div>
            </div>
            <div class="team-box blue" onclick="selectTeam('blue')">
                <div class="team-title" style="color:#4c9aff;">MAVİ</div>
                <div id="blue-players"></div>
            </div>
            <div class="team-box spectator" onclick="selectTeam('spectator')">
                <div class="team-title" style="color:#64748b;">İZLEYİCİ</div>
                <div id="spec-players"></div>
            </div>
        </div>
        <button class="start-game-btn" id="btn-start-game">MAÇI BAŞLAT</button>
        <button class="menu-btn" style="margin-top:15px; width:150px; padding:8px; font-size:12px; z-index:10;" onclick="leaveRoom()">ODADAN AYRIL</button>
    </div>

    <div id="screen-game" class="screen">
        <div id="game-wrapper">
            <canvas id="gameCanvas" width="1200" height="600"></canvas>
        </div>
        
        <div id="ui-layer">
            <div id="in-game-menu-btn" onclick="goToLobby()">🏠 Lobi</div>
            <div id="scoreboard">
                <span class="red-team">KIRMIZI <span id="score-red">0</span></span> 
                <span style="color:#64748b">:</span> 
                <span class="blue-team"><span id="score-blue">0</span> MAVİ</span>
            </div>
            
            <div class="ui-bars">
                <div id="stamina-container"><div id="stamina-bar"></div><div id="stamina-text">DEPAR</div></div>
                <div id="power-container"><div id="power-bar"></div><div id="power-text">ŞUT GÜCÜ</div></div>
            </div>
            
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            
            <div id="mobile-controls">
                <div class="mob-btn" id="btn-tackle">
                    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" stroke="white" stroke-width="10" fill="none"/></svg>
                </div>
                <div class="mob-btn" id="btn-sprint">
                    <svg viewBox="0 0 100 100"><path d="M30 30 L70 70 M70 30 L30 70" stroke="white" stroke-width="12" stroke-linecap="round"/></svg>
                </div>
                <div class="mob-btn" id="btn-action">
                    <svg viewBox="0 0 100 100"><polygon points="50,25 75,75 25,75" stroke="white" stroke-width="10" fill="none" stroke-linejoin="round"/></svg>
                </div>
            </div>

            <div id="pc-controls">
                <div class="key-row"><div class="key" id="key-w">W</div></div>
                <div class="key-row"><div class="key" id="key-a">A</div><div class="key" id="key-s">S</div><div class="key" id="key-d">D</div></div>
                <div class="key-row"><div class="key wide-key" id="key-space">BOŞLUK</div><div class="key" id="key-f">F</div></div>
            </div>
        </div>
    </div>

    <audio id="goalSound" src="https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg" preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        let myPlayerName = "";
        let currentRoom = null;
        let myTeam = "spectator";
        let serverListData = [];
        
        let myPlayer = null;
        let players = {};
        let ball = { x: 600, y: 300, z: 0, owner: null, possessionTimer: 0 };
        let score = { red: 0, blue: 0 };
        let isSpectator = true;

        let stamina = 100;
        let isExhausted = false; 
        const maxStamina = 100;
        const normalSpeed = 4.5;
        const sprintSpeed = 7.5;

        let isCharging = false;
        let shotPower = 0;
        let chargeStartTime = 0;
        let moveX = 0, moveY = 0;

        let ballRotation = 0;
        let ballTrail = [];
        
        let lastScore = { red: 0, blue: 0 };

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, ' ': false, 'f': false };

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- MENÜ OLAYLARI ---
        document.getElementById('btn-play').onclick = () => { document.getElementById('modal-name').style.display = 'flex'; };

        document.getElementById('btn-confirm-name').onclick = () => {
            let name = document.getElementById('input-player-name').value.trim();
            if (name === "") { alert("Lütfen bir isim girin!"); return; }
            myPlayerName = name;
            document.getElementById('modal-name').style.display = 'none';
            switchScreen('screen-server-list');
            socket.emit('get_servers');
        };

        document.getElementById('btn-back-main').onclick = () => switchScreen('screen-main-menu');
        document.getElementById('btn-exit').onclick = () => { window.location.href = "about:blank"; };
        document.getElementById('btn-show-create').onclick = () => document.getElementById('modal-create').style.display = 'flex';
        document.getElementById('btn-cancel-create').onclick = () => document.getElementById('modal-create').style.display = 'none';

        document.querySelectorAll('input[name="room-type"]').forEach(radio => {
            radio.onchange = (e) => { document.getElementById('input-room-pass').style.display = (e.target.value === 'community') ? 'block' : 'none'; };
        });

        document.getElementById('btn-confirm-create').onclick = () => {
            let name = document.getElementById('input-room-name').value || "Oda";
            let type = document.querySelector('input[name="room-type"]:checked').value;
            let pass = document.getElementById('input-room-pass').value;
            socket.emit('create_server', { name, type, password: pass, playerName: myPlayerName });
            document.getElementById('modal-create').style.display = 'none';
        };

        // --- SOCKET OLAYLARI ---
        socket.on('server_list', (list) => {
            serverListData = list;
            let container = document.getElementById('server-list-container');
            container.innerHTML = "";
            if (list.length === 0) {
                container.innerHTML = "<p style='text-align:center; font-weight:bold; color:#5a3a1b; font-size:18px;'>Henüz açılmış bir oda yok. Hemen bir tane oluştur!</p>";
                return;
            }
            list.forEach(srv => {
                let typeStr = srv.type === 'private' ? '🔒 Özel Oda' : '🌐 Topluluk';
                let div = document.createElement('div');
                div.className = 'server-item';
                div.innerHTML = `
                    <div>
                        <h3>${srv.name} <span style="font-size:12px;">(${srv.playerCount}/10)</span></h3>
                        <span>${typeStr}</span>
                    </div>
                    <button class="join-btn" onclick="joinRoom('${srv.id}', '${srv.type}')">KATIL</button>
                `;
                container.appendChild(div);
            });
        });

        window.joinRoom = (id, type) => {
            let pass = "";
            if (type === 'private') {
                pass = prompt("Bu Özel bir oda. Lütfen 6 haneli ODA KODUNU girin:");
                if (pass === null) return; 
            } else {
                let srv = serverListData.find(s => s.id === id);
                if (srv && srv.hasPassword) {
                     pass = prompt("Bu oda şifreli. Lütfen şifreyi girin:");
                     if (pass === null) return;
                }
            }
            socket.emit('join_server', { id: id, password: pass, playerName: myPlayerName });
        };

        socket.on('join_error', (msg) => { alert(msg); });
        socket.on('server_created', (room) => { currentRoom = room; myTeam = "spectator"; showLobby(room); });
        socket.on('joined_successfully', (room) => { currentRoom = room; showLobby(room); });

        function showLobby(room) {
            switchScreen('screen-lobby');
            document.getElementById('lobby-room-name').innerText = room.name;
            if (room.type === 'private') {
                let codeEl = document.getElementById('lobby-room-code');
                codeEl.innerText = "ODA KODU: " + room.id;
                codeEl.style.display = 'block';
            } else {
                document.getElementById('lobby-room-code').style.display = 'none';
            }
            document.getElementById('btn-start-game').style.display = (room.hostId === socket.id) ? 'block' : 'none';
        }

        socket.on('update_lobby', (room) => {
            currentRoom = room;
            if (room.status === 'lobby') {
                let redList = document.getElementById('red-players');
                let blueList = document.getElementById('blue-players');
                let specList = document.getElementById('spec-players');
                redList.innerHTML = ""; blueList.innerHTML = ""; specList.innerHTML = "";

                room.players.forEach(p => {
                    let el = `<div class="player-slot">${p.name}</div>`;
                    if (p.team === 'red') redList.innerHTML += el;
                    else if (p.team === 'blue') blueList.innerHTML += el;
                    else specList.innerHTML += el;
                    if (p.id === socket.id) myTeam = p.team;
                });
            }
        });

        window.selectTeam = (team) => {
            if (!currentRoom || currentRoom.status !== 'lobby') return;
            socket.emit('change_team', team);
        };

        document.getElementById('btn-start-game').onclick = () => socket.emit('start_game');
        socket.on('start_error', (msg) => { alert(msg); });

        socket.on('game_started', () => {
            switchScreen('screen-game');
            isSpectator = (myTeam === 'spectator');
            if(currentRoom) currentRoom.status = 'playing'; 
            lastScore = { red: 0, blue: 0 };
        });

        socket.on('game_ended', (room) => {
            currentRoom = room;
            switchScreen('screen-lobby');
        });

        function leaveRoom() {
            if (confirm("Odadan ayrılmak istiyor musunuz?")) window.location.href = window.location.pathname;
        }

        function goToLobby() {
            if (currentRoom && currentRoom.status === 'playing') {
                if (currentRoom.hostId === socket.id) {
                    if (confirm("Maçı sonlandırmak istediğinden emin misin?")) socket.emit('stop_game');
                } else {
                    alert("Maç devam ederken sadece sunucu sahibi maçı sonlandırabilir.");
                }
            } else switchScreen('screen-lobby');
        }

        socket.on('game_state', (room) => {
            if (room.status !== 'playing') return;
            currentRoom = room; 
            
            // Gol Sesi Kontrolü
            if (room.score.red > lastScore.red || room.score.blue > lastScore.blue) {
                document.getElementById('goalSound').play();
                lastScore = { red: room.score.red, blue: room.score.blue };
            }
            
            let currentIds = [];
            for (let p of room.players) {
                currentIds.push(p.id);
                if (p.id === socket.id) {
                    if (!myPlayer) myPlayer = p; 
                    myPlayer.team = p.team;
                    myPlayer.name = p.name;
                    players[socket.id] = myPlayer; 
                } else {
                    players[p.id] = p; 
                }
            }
            for (let id in players) { if (!currentIds.includes(id)) delete players[id]; }
            ball = room.ball; score = room.score;
            
            document.getElementById('score-red').innerText = score.red;
            document.getElementById('score-blue').innerText = score.blue;
            document.getElementById('stamina-container').style.display = isSpectator ? 'none' : 'flex';
        });

        // --- KLAVYE KONTROLLERİ (PC) ---
        window.addEventListener('keydown', (e) => { 
            if (isSpectator) return;
            let k = e.key === ' ' ? ' ' : e.key.toLowerCase();
            if (keys[k] !== undefined) keys[k] = true;
            if (k === ' ') {
                if (ball.owner === socket.id) { isCharging = true; chargeStartTime = Date.now(); }
                else { socket.emit('tackle'); }
            }
            updateKeyVisual(k, true);
        });

        window.addEventListener('keyup', (e) => { 
            if (isSpectator) return;
            let k = e.key === ' ' ? ' ' : e.key.toLowerCase();
            if (keys[k] !== undefined) keys[k] = false;
            if (k === ' ' && isCharging) {
                isCharging = false;
                let pressDuration = Date.now() - chargeStartTime;
                if (pressDuration < 200 && shotPower < 30) forcePass(); else executeKick();
            }
            updateKeyVisual(k, false);
        });

        function updateKeyVisual(key, isPressed) {
            let id = '';
            if(['w','a','s','d','f'].includes(key)) id = `key-${key}`;
            if(key === ' ') id = 'key-space';
            if(id) {
                const el = document.getElementById(id);
                if(el) {
                    if (id === 'key-f' && isExhausted && isPressed) return;
                    isPressed ? el.classList.add('active') : el.classList.remove('active');
                }
            }
        }

        function getKickAngle() {
            if (moveX !== 0 || moveY !== 0) return Math.atan2(moveY, moveX);
            else if (myPlayer && (myPlayer.lastDx !== 0 || myPlayer.lastDy !== 0)) return Math.atan2(myPlayer.lastDy, myPlayer.lastDx);
            return 0;
        }

        function forcePass() {
            if (ball.owner !== socket.id) return;
            let angle = getKickAngle();
            socket.emit('kick', { vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15, vz: 0, shotPower: 0 });
            shotPower = 0;
            document.getElementById('power-container').style.display = 'none';
        }

        function executeKick() {
            if (ball.owner !== socket.id) return;
            let angle = getKickAngle();
            let force = shotPower / 100; 
            let speed = 8 + (force * 27);
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed;
            let vz = 2 + (force * 8);
            socket.emit('kick', { vx: vx, vy: vy, vz: vz, shotPower: shotPower });
            shotPower = 0;
            document.getElementById('power-container').style.display = 'none';
        }

        // --- MOBİL KONTROLLER ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false, joystickVector = { x: 0, y: 0 }, maxDistance = 45;

        function handleTouch(e) {
            if (isSpectator) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const distance = Math.sqrt(dx*dx + dy*dy);
            if (distance > maxDistance) { dx = (dx / distance) * maxDistance; dy = (dy / distance) * maxDistance; }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickVector.x = dx / maxDistance;
            joystickVector.y = dy / maxDistance;
        }

        joystickZone.addEventListener('touchstart', (e) => { joystickActive = true; handleTouch(e); });
        joystickZone.addEventListener('touchmove', (e) => { if(joystickActive) handleTouch(e); });
        joystickZone.addEventListener('touchend', () => {
            joystickActive = false; joystickKnob.style.transform = 'translate(-50%, -50%)'; joystickVector = { x: 0, y: 0 };
        });

        const btnSprint = document.getElementById('btn-sprint');
        btnSprint.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isSpectator) keys['f'] = true; });
        btnSprint.addEventListener('touchend', (e) => { e.preventDefault(); if (!isSpectator) keys['f'] = false; });

        const btnTackle = document.getElementById('btn-tackle');
        btnTackle.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            if (!isSpectator && ball.owner !== socket.id) socket.emit('tackle'); 
        });

        const btnAction = document.getElementById('btn-action');
        btnAction.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isSpectator) return;
            if (ball.owner === socket.id) { isCharging = true; chargeStartTime = Date.now(); }
        });
        btnAction.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isSpectator) return;
            if (isCharging) {
                isCharging = false;
                let pressDuration = Date.now() - chargeStartTime;
                if (pressDuration < 200 && shotPower < 30) forcePass(); else executeKick();
            }
        });

        // --- HAREKET DÖNGÜSÜ ---
        function updateMovement() {
            if (isSpectator || !myPlayer || !currentRoom || currentRoom.status !== 'playing') { 
                requestAnimationFrame(updateMovement); return; 
            }

            let isSprinting = false;
            let currentSpeed = normalSpeed;

            if (isExhausted) {
                stamina += 0.15;
                if (stamina >= 30) isExhausted = false;
            } else {
                if (keys['f']) {
                    isSprinting = true;
                    currentSpeed = sprintSpeed;
                    stamina -= 1.2;
                    if (stamina <= 0) { stamina = 0; isExhausted = true; }
                } else { stamina += 0.15; }
            }
            if (stamina > maxStamina) stamina = maxStamina;

            const bar = document.getElementById('stamina-bar');
            if(bar) {
                bar.style.width = (stamina / maxStamina) * 100 + '%';
                if (isExhausted) bar.style.background = 'linear-gradient(90deg, #ef4444, #7f1d1d)';
                else if (stamina < 30) bar.style.background = 'linear-gradient(90deg, #f97316, #ea580c)';
                else bar.style.background = 'linear-gradient(90deg, #22c55e, #eab308)';
            }

            if (isCharging && ball.owner === socket.id) {
                document.getElementById('power-container').style.display = 'flex'; 
                shotPower += 3.5;
                if (shotPower > 100) shotPower = 100;
                const pBar = document.getElementById('power-bar');
                pBar.style.width = shotPower + '%';
                if (shotPower < 38) pBar.style.background = '#ef4444'; 
                else pBar.style.background = `linear-gradient(90deg, #22c55e ${shotPower}%, #eab308)`; 
            } else if (!isCharging) {
                document.getElementById('power-container').style.display = 'none';
                shotPower = 0;
            }

            let dx = 0, dy = 0;
            if (keys.w || keys.ArrowUp) dy -= 1;
            if (keys.s || keys.ArrowDown) dy += 1;
            if (keys.a || keys.ArrowLeft) dx -= 1;
            if (keys.d || keys.ArrowRight) dx += 1;
            if (joystickActive) { dx += joystickVector.x; dy += joystickVector.y; }

            if (dx !== 0 || dy !== 0) {
                let length = Math.hypot(dx, dy);
                let speedMultiplier = isCharging ? 0.5 : 1;
                dx = (dx / length) * (currentSpeed * speedMultiplier);
                dy = (dy / length) * (currentSpeed * speedMultiplier);
                myPlayer.lastDx = dx; myPlayer.lastDy = dy;
            }
            moveX = dx; moveY = dy;

            myPlayer.x = Math.max(25, Math.min(1200 - 25, myPlayer.x + dx));
            myPlayer.y = Math.max(25, Math.min(600 - 25, myPlayer.y + dy));
            socket.emit('move', { x: myPlayer.x, y: myPlayer.y });

            requestAnimationFrame(updateMovement);
        }

        // --- ÇİZİM DÖNGÜSÜ ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Tribün Çizimi (Arka plan)
        function drawStadium() {
            // Siyah dış alan
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 1200, 600);
            
            // Taraftar noktaları
            for(let i=0; i<1200; i+=12) {
                for(let j=0; j<600; j+=12) {
                    // Sadece saha dışındaki alanları doldur (Kenarlar ve üst/alt)
                    if (i < 30 || i > 1170 || j < 30 || j > 570) {
                        if (Math.random() > 0.5) { // Rastgele renkler
                            let colors = ['#ef4444', '#3b82f6', '#ffffff', '#fbbf24'];
                            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                            ctx.fillRect(i, j, 8, 8);
                        }
                    }
                }
            }
        }

        function drawPitch() {
            const stripeWidth = 1200 / 16;
            for (let i = 0; i < 16; i++) {
                ctx.fillStyle = (i % 2 === 0) ? '#2e7d32' : '#388e3c'; 
                ctx.fillRect(i * stripeWidth, 0, stripeWidth, 600);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const margin = 30;
            
            ctx.strokeRect(margin, margin, 1200 - (margin * 2), 600 - (margin * 2));
            ctx.beginPath(); ctx.moveTo(600, margin); ctx.lineTo(600, 600 - margin); ctx.stroke();
            ctx.beginPath(); ctx.arc(600, 300, 70, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(600, 300, 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill();
            
            const penaltyW = 160, penaltyH = 300, penaltyY = (600 - penaltyH) / 2;
            ctx.strokeRect(margin, penaltyY, penaltyW, penaltyH); ctx.strokeRect(1200 - margin - penaltyW, penaltyY, penaltyW, penaltyH);
            
            const goalAreaW = 60, goalAreaH = 180, goalAreaY = (600 - goalAreaH) / 2;
            ctx.strokeRect(margin, goalAreaY, goalAreaW, goalAreaH); ctx.strokeRect(1200 - margin - goalAreaW, goalAreaY, goalAreaW, goalAreaH);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(margin - 10, 200, 10, 200); ctx.fillRect(1200 - margin, 200, 10, 200);

            // Bariyer Çizgisi (Santra)
            if (currentRoom && currentRoom.isKickoff) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                if (currentRoom.concedingTeam === 'blue') {
                    ctx.fillRect(600, 30, 10, 540); // Mavi yedi, Kırmızı geçemez
                } else {
                    ctx.fillRect(590, 30, 10, 540); // Kırmızı yedi, Mavi geçemez
                }
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("SANTRA", 600, 50);
            }
        }

        function drawBall() {
            let drawY = ball.y - (ball.z || 0);
            let shadowScale = Math.max(0.3, 1 - (ball.z / 150)); 
            ctx.beginPath(); ctx.ellipse(ball.x, ball.y, 15 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 0, 0, ${0.4 * shadowScale})`; ctx.fill();

            let speed = Math.hypot(ball.vx || 0, ball.vy || 0);
            if (speed > 5 && ball.z === 0) ballTrail.push({ x: ball.x, y: drawY, alpha: 0.5 });
            if (ballTrail.length > 8) ballTrail.shift();
            for (let i = 0; i < ballTrail.length; i++) {
                let t = ballTrail[i]; t.alpha -= 0.05;
                if (t.alpha > 0) {
                    ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${t.alpha})`; ctx.fill();
                }
            }

            ballRotation += speed * 0.05;
            ctx.save(); ctx.translate(ball.x, drawY); ctx.rotate(ballRotation);
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#1a1a1a'; ctx.stroke();
            function drawPentagon(radius, offsetX, offsetY, angle) {
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    let a = angle + i * (Math.PI * 2 / 5);
                    let x = offsetX + Math.cos(a) * radius; let y = offsetY + Math.sin(a) * radius;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath(); ctx.fillStyle = '#1a1a1a'; ctx.fill();
            }
            drawPentagon(5.5, 0, 0, 0); drawPentagon(4, 10, 0, 0.5); drawPentagon(4, -10, 0, 1.5); drawPentagon(4, 0, 10, 0.8); drawPentagon(4, 0, -10, 1.2);
            ctx.restore();
        }

        function gameLoop() {
            if (document.getElementById('screen-game').classList.contains('active')) {
                ctx.clearRect(0, 0, 1200, 600);
                drawStadium(); // Önce tribünleri çiz
                drawPitch();   // Sonra sahayı çiz
                drawBall();

                for (let id in players) {
                    let p = players[id];
                    if (!p || p.team === 'spectator') continue;
                    
                    let pSize = 22;
                    ctx.beginPath(); ctx.arc(p.x, p.y + 5, pSize, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
                    ctx.beginPath(); ctx.arc(p.x, p.y, pSize, 0, Math.PI * 2);
                    
                    ctx.fillStyle = p.team === 'red' ? '#ff0000' : '#1e90ff';
                    ctx.fill(); 
                    ctx.strokeStyle = p.team === 'red' ? '#000000' : '#cccccc';
                    ctx.lineWidth = 3; 
                    ctx.stroke();
                    
                    if (id === ball.owner && ball.possessionTimer > 0) {
                        let time = Date.now(); let pulse = (Math.sin(time / 80) + 1) / 2; 
                        let radius = pSize + 4 + (pulse * 6); 
                        ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(57, 255, 20, ${0.6 + (pulse * 0.4)})`; ctx.lineWidth = 4;
                        ctx.shadowColor = '#39FF14'; ctx.shadowBlur = 10 + (pulse * 10); ctx.stroke(); ctx.restore();

                        let secs = (ball.possessionTimer / 60).toFixed(1);
                        ctx.fillStyle = '#eab308';
                        ctx.font = 'bold 14px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(secs + "s", p.x, p.y - pSize - 15);
                    }

                    if (id === socket.id && isCharging && shotPower >= 38) {
                        let intensity = shotPower / 100; let time = Date.now() / 100;
                        ctx.beginPath(); ctx.arc(p.x, p.y, pSize + 10 + (intensity * 15), 0, Math.PI * 2); ctx.fillStyle = `rgba(88, 28, 135, ${intensity * 0.4})`; ctx.fill();
                        for (let i = 0; i < 5; i++) {
                            let angle = time + (i * Math.PI * 2 / 5); let rad1 = pSize; let rad2 = pSize + 20 + (intensity * 10);
                            ctx.beginPath(); ctx.moveTo(p.x + Math.cos(angle) * rad1, p.y + Math.sin(angle) * rad1);
                            let midAngle = angle + (Math.random() - 0.5) * 0.5;
                            ctx.lineTo(p.x + Math.cos(midAngle) * (rad1+rad2)/2, p.y + Math.sin(midAngle) * (rad1+rad2)/2);
                            ctx.lineTo(p.x + Math.cos(angle) * rad2, p.y + Math.sin(angle) * rad2);
                            ctx.strokeStyle = `rgba(168, 85, 247, ${intensity})`; ctx.lineWidth = 2; ctx.stroke();
                        }
                    }
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; 
                    ctx.fillText(p.name, p.x, p.y - pSize - 5);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        updateMovement();
        gameLoop();
    </script>
</body>
</html>
