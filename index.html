<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Critiball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none; /* Mobilde kaydırmayı engeller */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #scoreboard {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }
        .red-team { color: #ff4c4c; }
        .blue-team { color: #4c9aff; }
        
        canvas {
            background-color: #2e7d32; /* Çim rengi */
            border: 4px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            /* Ekran boyutuna göre ayarla */
            max-width: 95vw;
            max-height: 75vh;
        }

        /* Mobil Joystick Stili */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none; /* Sadece mobilde görünür */
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Joystick sadece dokunmatik cihazlarda görünsün */
        @media (pointer: coarse) {
            #joystick-zone { display: block; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="scoreboard">
            <span class="red-team">Kırmızı: <span id="score-red">0</span></span> 
            - 
            <span class="blue-team">Mavi: <span id="score-blue">0</span></span>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- Mobil Kontrol -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <!-- Socket.io Kütüphanesi -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        let myPlayer = null;
        let players = {};
        let ball = { x: 400, y: 250 };
        let score = { red: 0, blue: 0 };

        // Klavye Kontrolleri (Bilgisayar)
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        
        window.addEventListener('keydown', (e) => { if(e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if(e.key in keys) keys[e.key] = false; });

        // Mobil Joystick Kontrolleri
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        const maxDistance = 40;

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickVector.x = dx / maxDistance;
            joystickVector.y = dy / maxDistance;
        }

        joystickZone.addEventListener('touchstart', (e) => { joystickActive = true; handleTouch(e); });
        joystickZone.addEventListener('touchmove', (e) => { if(joystickActive) handleTouch(e); });
        joystickZone.addEventListener('touchend', (e) => {
            joystickActive = false;
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            joystickVector = { x: 0, y: 0 };
        });

        // Socket Bağlantıları
        socket.on('currentPlayers', (p, b, s) => {
            players = p;
            ball = b;
            score = s;
            myPlayer = players[socket.id];
        });

        socket.on('newPlayer', (player) => {
            players[player.id] = player;
        });

        socket.on('playerDisconnected', (id) => {
            delete players[id];
        });

        socket.on('gameState', (p, b, s) => {
            players = p;
            ball = b;
            score = s;
            
            document.getElementById('score-red').innerText = score.red;
            document.getElementById('score-blue').innerText = score.blue;
            
            draw();
        });

        // Oyun Döngüsü (Hareketi Sunucuya Gönder)
        function updateMovement() {
            if (!myPlayer) return;

            let speed = 4;
            let dx = 0;
            let dy = 0;

            // Klavye Hareketi
            if (keys.w || keys.ArrowUp) dy -= speed;
            if (keys.s || keys.ArrowDown) dy += speed;
            if (keys.a || keys.ArrowLeft) dx -= speed;
            if (keys.d || keys.ArrowRight) dx += speed;

            // Joystick Hareketi
            if (joystickActive) {
                dx += joystickVector.x * speed;
                dy += joystickVector.y * speed;
            }

            // Sınırları kontrol et
            let newX = Math.max(20, Math.min(780, myPlayer.x + dx));
            let newY = Math.max(20, Math.min(480, myPlayer.y + dy));

            if (newX !== myPlayer.x || newY !== myPlayer.y) {
                myPlayer.x = newX;
                myPlayer.y = newY;
                socket.emit('move', { x: newX, y: newY });

                // Topa vurma kontrolü (Mesafe yakınsa)
                let distToBall = Math.hypot(myPlayer.x - ball.x, myPlayer.y - ball.y);
                if (distToBall < 30) {
                    // Topu oyuncunun baktığı yöne doğru fırlat
                    socket.emit('kick', { 
                        vx: (ball.x - myPlayer.x) * 1.5, 
                        vy: (ball.y - myPlayer.y) * 1.5 
                    });
                }
            }

            requestAnimationFrame(updateMovement);
        }

        // Çizim Fonksiyonu
        function draw() {
            // Arka planı temizle
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Saha Çizgileri
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(400, 0);
            ctx.lineTo(400, 500);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(400, 250, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Kaleler
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(0, 150, 10, 200); // Sol kale
            ctx.fillRect(790, 150, 10, 200); // Sağ kale

            // Topu Çiz
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Oyuncuları Çiz
            for (let id in players) {
                let p = players[id];
                ctx.beginPath();
                ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = p.team === 'red' ? '#ff4c4c' : '#4c9aff';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // İsim Yazdır
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 30);
            }
        }

        // Oyunu Başlat
        updateMovement();
        draw();
    </script>
</body>
</html>
