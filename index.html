<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Critiball</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #scoreboard { font-size: 36px; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,255,255,0.3), 2px 2px 4px #000; letter-spacing: 2px; }
        .red-team { color: #ff4c4c; text-shadow: 0 0 15px #ff4c4c; }
        .blue-team { color: #4c9aff; text-shadow: 0 0 15px #4c9aff; }
        
        canvas { width: 90vw; height: 70vh; background-color: #111; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5); }
        
        .ui-bars { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; align-items: center; }
        
        #possession-text {
            display: none; font-size: 20px; font-weight: 900; color: #eab308;
            text-shadow: 0 0 15px #eab308, 0 0 5px #000; margin-top: 5px; letter-spacing: 1px;
        }

        #stamina-container {
            width: 350px; height: 24px; background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            overflow: hidden; display: flex; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        #stamina-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #eab308); transition: width 0.1s linear, background 0.3s; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        #stamina-text { position: absolute; width: 350px; text-align: center; font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 1px 1px 2px #000; }

        #power-container {
            width: 350px; height: 16px; background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px;
            overflow: hidden; display: none; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        #power-bar { height: 100%; width: 0%; background: #ef4444; transition: width 0.05s linear, background 0.1s; }
        #power-text { position: absolute; width: 350px; text-align: center; font-size: 10px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 1px 1px 2px #000; }

        #pc-controls { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
        .key-row { display: flex; gap: 12px; }
        .key {
            width: 60px; height: 60px; background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 20px; color: #94a3b8;
            transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.4); backdrop-filter: blur(8px);
        }
        .key.active { background: rgba(76, 154, 255, 0.9); color: white; border-color: #fff; transform: translateY(4px); box-shadow: 0 0 20px #4c9aff; }
        .key.disabled { opacity: 0.3; background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .wide-key { width: 130px; }

        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; display: none; backdrop-filter: blur(5px); }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; background: rgba(76, 154, 255, 0.6); box-shadow: 0 0 15px rgba(76, 154, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); }
        
        @media (pointer: coarse) {
            #joystick-zone { display: block; }
            #pc-controls { display: none; }
            canvas { width: 100vw; height: 100vh; border-radius: 0; border: none; }
            #scoreboard { position: absolute; top: 80px; font-size: 28px; }
            #stamina-container { width: 200px; height: 16px; }
            #stamina-text { width: 200px; }
            #power-container { width: 200px; height: 12px; }
            #power-text { width: 200px; font-size: 8px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="ui-bars">
            <div id="stamina-container">
                <div id="stamina-bar"></div>
                <div id="stamina-text">DEPAR KONDİSYONU</div>
            </div>
            <div id="power-container">
                <div id="power-bar"></div>
                <div id="power-text">ŞUT GÜCÜ</div>
            </div>
            <div id="possession-text">🔥 TOP SENDE!</div>
        </div>

        <div id="scoreboard">
            <span class="red-team">KIRMIZI <span id="score-red">0</span></span> 
            <span style="color:#64748b">:</span> 
            <span class="blue-team"><span id="score-blue">0</span> MAVİ</span>
        </div>
        
        <canvas id="gameCanvas" width="1200" height="600"></canvas>

        <div id="joystick-zone"><div id="joystick-knob"></div></div>

        <div id="pc-controls">
            <div class="key-row"><div class="key" id="key-w">W</div></div>
            <div class="key-row"><div class="key" id="key-a">A</div><div class="key" id="key-s">S</div><div class="key" id="key-d">D</div></div>
            <div class="key-row">
                <div class="key wide-key" id="key-space">SPACE</div>
                <div class="key" id="key-f">F</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let socket = null; try { socket = io(); } catch(e) {}

        let myPlayer = null;
        let players = {};
        let ball = { x: 600, y: 300, z: 0, owner: null, possessionTimer: 0 };
        let score = { red: 0, blue: 0 };

        let stamina = 100;
        let isExhausted = false; 
        const maxStamina = 100;
        const normalSpeed = 4.5;
        const sprintSpeed = 7.5;

        let isCharging = false;
        let shotPower = 0;
        let chargeStartTime = 0;
        let moveX = 0, moveY = 0;

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, ' ': false, 'f': false };
        
        window.addEventListener('keydown', (e) => { 
            let k = e.key === ' ' ? ' ' : e.key.toLowerCase();
            if (keys[k] !== undefined) keys[k] = true;
            
            if (k === ' ') {
                if (ball.owner === socket.id) {
                    isCharging = true;
                    chargeStartTime = Date.now();
                }
            }
            updateKeyVisual(k, true);
        });

        window.addEventListener('keyup', (e) => { 
            let k = e.key === ' ' ? ' ' : e.key.toLowerCase();
            if (keys[k] !== undefined) keys[k] = false;

            if (k === ' ' && isCharging) {
                isCharging = false;
                let pressDuration = Date.now() - chargeStartTime;
                if (pressDuration < 200 && shotPower < 30) { 
                    forcePass();
                } else {
                    executeKick();
                }
            }
            updateKeyVisual(k, false);
        });

        function getKickAngle() {
            if (moveX !== 0 || moveY !== 0) {
                return Math.atan2(moveY, moveX);
            } else if (myPlayer.lastDx !== 0 || myPlayer.lastDy !== 0) {
                return Math.atan2(myPlayer.lastDy, myPlayer.lastDx);
            }
            return 0;
        }

        function forcePass() {
            if (ball.owner !== socket.id) return;
            let angle = getKickAngle();
            // Pas hızı 15 yapıldı (Çok hızlı, sen koşarken bile top kaçar)
            if (socket) socket.emit('kick', { vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15, vz: 0 });
            shotPower = 0;
            document.getElementById('power-container').style.display = 'none';
        }

        function executeKick() {
            if (ball.owner !== socket.id) return;
            
            let angle = getKickAngle();
            let vx = 0, vy = 0, vz = 0;

            if (shotPower < 30) { 
                vx = Math.cos(angle) * 15;
                vy = Math.sin(angle) * 15;
                vz = 0;
            } else {
                let force = shotPower / 100; 
                // Şut hızı 22 ile 37 arası yapıldı (Füze gibi)
                vx = Math.cos(angle) * (22 + (force * 15)); 
                vy = Math.sin(angle) * (22 + (force * 15));
                vz = 2 + (force * 10);
            }
            
            if (socket) socket.emit('kick', { vx: vx, vy: vy, vz: vz });
            shotPower = 0;
            document.getElementById('power-container').style.display = 'none';
        }

        function updateKeyVisual(key, isPressed) {
            let id = '';
            if(['w','a','s','d','f'].includes(key)) id = `key-${key}`;
            if(key === ' ') id = 'key-space';
            if(id) {
                const el = document.getElementById(id);
                if(el) {
                    if (id === 'key-f' && isExhausted && isPressed) return;
                    isPressed ? el.classList.add('active') : el.classList.remove('active');
                }
            }
        }

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false, joystickVector = { x: 0, y: 0 }, maxDistance = 50;

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const distance = Math.sqrt(dx*dx + dy*dy);
            if (distance > maxDistance) { dx = (dx / distance) * maxDistance; dy = (dy / distance) * maxDistance; }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickVector.x = dx / maxDistance;
            joystickVector.y = dy / maxDistance;
        }

        joystickZone.addEventListener('touchstart', (e) => { joystickActive = true; handleTouch(e); });
        joystickZone.addEventListener('touchmove', (e) => { if(joystickActive) handleTouch(e); });
        joystickZone.addEventListener('touchend', () => {
            joystickActive = false; joystickKnob.style.transform = 'translate(-50%, -50%)'; joystickVector = { x: 0, y: 0 };
        });

        if (socket) {
            socket.on('currentPlayers', (p, b, s) => {
                players = p; ball = b; score = s; 
                if (players[socket.id]) myPlayer = players[socket.id];
            });
            socket.on('newPlayer', (player) => { players[player.id] = player; });
            socket.on('playerDisconnected', (id) => { delete players[id]; });
            
            socket.on('gameState', (p, b, s) => {
                for(let id in p) { if(id !== socket.id) players[id] = p[id]; }
                ball = b; score = s;
                document.getElementById('score-red').innerText = score.red;
                document.getElementById('score-blue').innerText = score.blue;

                const possText = document.getElementById('possession-text');
                if (ball.owner === socket.id) {
                    possText.style.display = 'block';
                    let secondsLeft = (ball.possessionTimer / 60).toFixed(1);
                    possText.innerText = `🔥 TOP SENDE! (${secondsLeft} sn)`;
                    possText.style.color = "#eab308";
                } else {
                    possText.style.display = 'none';
                }
            });
        }

        function updateMovement() {
            if (!myPlayer) { requestAnimationFrame(updateMovement); return; }

            let isSprinting = false;
            let currentSpeed = normalSpeed;

            if (isExhausted) {
                stamina += 0.15;
                if (stamina >= 30) isExhausted = false;
                const fKey = document.getElementById('key-f');
                if (fKey) fKey.classList.add('disabled');
            } else {
                if (keys['f']) {
                    isSprinting = true;
                    currentSpeed = sprintSpeed;
                    stamina -= 1.2;
                    if (stamina <= 0) { stamina = 0; isExhausted = true; }
                } else {
                    stamina += 0.15;
                }
                const fKey = document.getElementById('key-f');
                if (fKey) fKey.classList.remove('disabled');
            }
            if (stamina > maxStamina) stamina = maxStamina;

            const bar = document.getElementById('stamina-bar');
            bar.style.width = (stamina / maxStamina) * 100 + '%';
            if (isExhausted) bar.style.background = 'linear-gradient(90deg, #ef4444, #7f1d1d)';
            else if (stamina < 30) bar.style.background = 'linear-gradient(90deg, #f97316, #ea580c)';
            else bar.style.background = 'linear-gradient(90deg, #22c55e, #eab308)';

            if (isCharging && ball.owner === socket.id) {
                document.getElementById('power-container').style.display = 'flex'; 
                shotPower += 3.5; // Daha hızlı dolsun
                if (shotPower > 100) shotPower = 100;

                const pBar = document.getElementById('power-bar');
                pBar.style.width = shotPower + '%';
                
                if (shotPower < 38) pBar.style.background = '#ef4444'; 
                else pBar.style.background = `linear-gradient(90deg, #22c55e ${shotPower}%, #eab308)`; 
            } else if (!isCharging) {
                document.getElementById('power-container').style.display = 'none';
                shotPower = 0;
            }

            let dx = 0, dy = 0;
            if (keys.w || keys.ArrowUp) dy -= 1;
            if (keys.s || keys.ArrowDown) dy += 1;
            if (keys.a || keys.ArrowLeft) dx -= 1;
            if (keys.d || keys.ArrowRight) dx += 1;
            if (joystickActive) { dx += joystickVector.x; dy += joystickVector.y; }

            if (dx !== 0 || dy !== 0) {
                let length = Math.hypot(dx, dy);
                let speedMultiplier = isCharging ? 0.5 : 1;
                dx = (dx / length) * (currentSpeed * speedMultiplier);
                dy = (dy / length) * (currentSpeed * speedMultiplier);
                
                myPlayer.lastDx = dx;
                myPlayer.lastDy = dy;
            }
            
            // Anlık hareketi kaydet
            moveX = dx; moveY = dy;

            myPlayer.x = Math.max(25, Math.min(canvas.width - 25, myPlayer.x + dx));
            myPlayer.y = Math.max(25, Math.min(canvas.height - 25, myPlayer.y + dy));
            if (socket) socket.emit('move', { x: myPlayer.x, y: myPlayer.y });

            requestAnimationFrame(updateMovement);
        }

        function drawPitch() {
            const stripeWidth = canvas.width / 16;
            for (let i = 0; i < 16; i++) {
                ctx.fillStyle = (i % 2 === 0) ? '#2e7d32' : '#388e3c'; 
                ctx.fillRect(i * stripeWidth, 0, stripeWidth, canvas.height);
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const margin = 30;
            ctx.strokeRect(margin, margin, canvas.width - (margin * 2), canvas.height - (margin * 2));
            ctx.beginPath(); ctx.moveTo(canvas.width / 2, margin); ctx.lineTo(canvas.width / 2, canvas.height - margin); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill();

            const penaltyW = 160, penaltyH = 260, penaltyY = (canvas.height - penaltyH) / 2;
            ctx.strokeRect(margin, penaltyY, penaltyW, penaltyH);
            ctx.strokeRect(canvas.width - margin - penaltyW, penaltyY, penaltyW, penaltyH);

            const goalAreaW = 60, goalAreaH = 120, goalAreaY = (canvas.height - goalAreaH) / 2;
            ctx.strokeRect(margin, goalAreaY, goalAreaW, goalAreaH);
            ctx.strokeRect(canvas.width - margin - goalAreaW, goalAreaY, goalAreaW, goalAreaH);

            ctx.beginPath(); ctx.arc(margin + 110, canvas.height / 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width - margin - 110, canvas.height / 2, 3, 0, Math.PI * 2); ctx.fill();
            
            ctx.beginPath(); ctx.arc(margin + penaltyW, canvas.height / 2, 50, Math.PI * 0.65, Math.PI * 1.35); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width - margin - penaltyW, canvas.height / 2, 50, -Math.PI * 0.35, Math.PI * 0.35); ctx.stroke();
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(margin - 10, canvas.height / 2 - 100, 10, 200); 
            ctx.fillRect(canvas.width - margin, canvas.height / 2 - 100, 10, 200);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPitch();

            // Top Çizimi
            ctx.beginPath(); ctx.ellipse(ball.x, ball.y, 15, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();

            let drawY = ball.y - (ball.z || 0);
            ctx.beginPath(); ctx.arc(ball.x, drawY, 15, 0, Math.PI * 2); 
            ctx.fillStyle = '#fff'; ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

            // Oyuncular
            for (let id in players) {
                let p = players[id];
                if (!p) continue;
                
                ctx.beginPath(); ctx.arc(p.x, p.y + 5, 22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();

                ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
                ctx.fillStyle = p.team === 'red' ? '#ff4c4c' : '#4c9aff';
                ctx.fill(); 
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                
                if (id === ball.owner && ball.possessionTimer > 0) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, Math.PI * 2);
                    ctx.strokeStyle = '#eab308'; 
                    ctx.lineWidth = 4; 
                    ctx.stroke();
                }

                // KARADELİK VE YILDIRIM EFEKTİ
                if (id === socket.id && isCharging && shotPower >= 38) {
                    let intensity = shotPower / 100;
                    let time = Date.now() / 100;

                    // Karadelik
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 35 + (intensity * 20), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(88, 28, 135, ${intensity * 0.4})`;
                    ctx.fill();

                    // Yıldırımlar
                    for (let i = 0; i < 5; i++) {
                        let angle = time + (i * Math.PI * 2 / 5);
                        let rad1 = 25;
                        let rad2 = 45 + (intensity * 15);
                        
                        ctx.beginPath();
                        ctx.moveTo(p.x + Math.cos(angle) * rad1, p.y + Math.sin(angle) * rad1);
                        let midAngle = angle + (Math.random() - 0.5) * 0.5;
                        ctx.lineTo(p.x + Math.cos(midAngle) * (rad1+rad2)/2, p.y + Math.sin(midAngle) * (rad1+rad2)/2);
                        ctx.lineTo(p.x + Math.cos(angle) * rad2, p.y + Math.sin(angle) * rad2);
                        
                        ctx.strokeStyle = `rgba(168, 85, 247, ${intensity})`;
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                }

                ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 35);
            }

            requestAnimationFrame(gameLoop);
        }

        updateMovement();
        gameLoop();
    </script>
</body>
</html>
