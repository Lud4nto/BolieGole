<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BolieGole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body { margin: 0; padding: 0; background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        
        /* --- EKRANLAR (Kapsayıcılar) --- */
        .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .active { display: flex; }

        /* --- ANA MENÜ --- */
        #screen-main-menu { background-image: url('menu.png'); background-size: cover; background-position: center; }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 180px; }
        .menu-btn { width: 320px; padding: 15px; background-color: #d4a373; border: 4px solid #8b5a2b; box-shadow: 4px 4px 0px #5a3a1b; border-radius: 8px; font-family: 'Press Start 2P', cursive; font-size: 24px; color: #2b1b0e; cursor: pointer; text-align: center; text-transform: uppercase; transition: all 0.1s ease; }
        .menu-btn:hover { background-color: #e0b88e; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #5a3a1b; }
        .menu-btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #5a3a1b; }

        /* --- SUNUCU LİSTESİ --- */
        #screen-server-list { background: #0f172a; }
        .list-container { width: 80%; max-width: 800px; height: 60vh; background: rgba(30, 41, 59, 0.8); border-radius: 12px; padding: 20px; overflow-y: auto; border: 2px solid #4c9aff; position: relative; }
        .top-bar { width: 80%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .create-btn { background: #22c55e; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .create-btn:hover { background: #16a34a; }
        .server-item { background: rgba(255,255,255,0.1); padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #4c9aff; }
        .server-item:hover { background: rgba(255,255,255,0.2); }
        .join-btn { background: #4c9aff; color: white; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* --- MODAL (ODA OLUŞTUR) --- */
        #modal-create { background: rgba(0,0,0,0.8); position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 400px; display: flex; flex-direction: column; gap: 15px; border: 2px solid #4c9aff; }
        .modal-content input[type="text"], .modal-content input[type="password"] { padding: 10px; border-radius: 6px; border: 1px solid #64748b; background: #0f172a; color: white; font-size: 16px; }
        .radio-group { display: flex; gap: 20px; }
        .radio-group label { cursor: pointer; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: #ef4444; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-confirm { background: #22c55e; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }

        /* --- LOBİ (TAKIM SEÇME) --- */
        #screen-lobby { background: #0f172a; }
        .lobby-header { text-align: center; margin-bottom: 30px; }
        .room-code { font-size: 36px; font-weight: bold; color: #eab308; letter-spacing: 5px; text-shadow: 0 0 10px #eab308; }
        .teams-container { display: flex; gap: 20px; }
        .team-box { width: 300px; height: 400px; background: rgba(30,41,59,0.8); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .team-box.red { border-color: #ff4c4c; background: rgba(255, 76, 76, 0.1); }
        .team-box.blue { border-color: #4c9aff; background: rgba(76, 154, 255, 0.1); }
        .team-box.spectator { border-color: #64748b; background: rgba(100, 116, 139, 0.1); }
        .team-box:hover { transform: scale(1.05); }
        .team-title { font-size: 28px; font-weight: bold; margin-bottom: 20px; }
        .player-slot { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 6px; margin-bottom: 10px; text-align: center; }
        .start-game-btn { margin-top: 30px; padding: 15px 40px; font-size: 24px; font-weight: bold; background: #eab308; color: #000; border: none; border-radius: 8px; cursor: pointer; display: none; }

        /* --- OYUN EKRANI --- */
        #screen-game { background: #111; position: relative; }
        #in-game-menu-btn { position: absolute; top: 20px; left: 20px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #2b1b0e; padding: 12px 24px; border-radius: 30px; font-family: 'Segoe UI', sans-serif; font-weight: 900; font-size: 20px; display: flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 154, 158, 0.5); transition: all 0.2s ease; z-index: 100; border: 3px solid #ffffff; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        #in-game-menu-btn:hover { transform: scale(1.05) translateY(-3px); box-shadow: 0 8px 25px rgba(255, 154, 158, 0.8); }
        #in-game-menu-btn:active { transform: scale(0.95) translateY(0); }
        
        #scoreboard { font-size: 36px; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.3), 2px 2px 4px #000; letter-spacing: 2px; }
        .red-team { color: #ff4c4c; text-shadow: 0 0 15px #ff4c4c; }
        .blue-team { color: #4c9aff; text-shadow: 0 0 15px #4c9aff; }
        
        canvas { width: 90vw; height: 70vh; background-color: #111; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        
        .ui-bars { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; align-items: center; }
        #stamina-container { width: 350px; height: 24px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; overflow: hidden; display: flex; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        #stamina-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #eab308); transition: width 0.1s linear, background 0.3s; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        #stamina-text { position: absolute; width: 350px; text-align: center; font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 1px 1px 2px #000; }

        #power-container { width: 350px; height: 16px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; overflow: hidden; display: none; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        #power-bar { height: 100%; width: 0%; background: #ef4444; transition: width 0.05s linear, background 0.1s; }
        #power-text { position: absolute; width: 350px; text-align: center; font-size: 10px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 1px 1px 2px #000; }

        #pc-controls { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
        .key-row { display: flex; gap: 12px; }
        .key { width: 60px; height: 60px; background: rgba(30, 41, 59, 0.6); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; color: #94a3b8; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.4); backdrop-filter: blur(8px); }
        .key.active { background: rgba(76, 154, 255, 0.9); color: white; border-color: #fff; transform: translateY(4px); box-shadow: 0 0 20px #4c9aff; }
        .key.disabled { opacity: 0.3; background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        .wide-key { width: 130px; }

        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; display: none; backdrop-filter: blur(5px); }
        #joystick-knob { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; background: rgba(76, 154, 255, 0.6); box-shadow: 0 0 15px rgba(76, 154, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); }
        
        @media (pointer: coarse) {
            #joystick-zone { display: block; }
            #pc-controls { display: none; }
            canvas { width: 100vw; height: 100vh; border-radius: 0; border: none; }
            #scoreboard { position: absolute; top: 80px; font-size: 28px; }
            #stamina-container { width: 200px; height: 16px; }
            #stamina-text { width: 200px; }
            #power-container { width: 200px; height: 12px; }
            #power-text { width: 200px; font-size: 8px; }
            .list-container { width: 95%; height: 70vh; }
            .team-box { width: 30%; height: 300px; }
        }
    </style>
</head>
<body>

    <!-- 1. ANA MENÜ -->
    <div id="screen-main-menu" class="screen active">
        <div class="menu-buttons">
            <button class="menu-btn" id="btn-play">PLAY</button>
            <button class="menu-btn" id="btn-options">OPTIONS</button>
            <button class="menu-btn" id="btn-credits">CREDITS</button>
            <button class="menu-btn" id="btn-exit">EXIT</button>
        </div>
    </div>

    <!-- 2. SUNUCU LİSTESİ -->
    <div id="screen-server-list" class="screen">
        <div class="top-bar">
            <h2>Sunucu Listesi</h2>
            <button class="create-btn" id="btn-show-create">Sunucu Oluştur</button>
        </div>
        <div class="list-container" id="server-list-container">
            <!-- Sunucular buraya gelecek -->
            <p style="text-align:center; color:#64748b;">Yükleniyor...</p>
        </div>
        <button class="menu-btn" style="margin-top:20px; width:200px;" onclick="switchScreen('screen-main-menu')">Geri Dön</button>
    </div>

    <!-- 3. ODA OLUŞTURMA MODALI -->
    <div id="modal-create">
        <div class="modal-content">
            <h2 style="margin:0 0 10px 0;">Sunucu Oluştur</h2>
            <input type="text" id="input-room-name" placeholder="Sunucu Adı">
            
            <div class="radio-group">
                <label><input type="radio" name="room-type" value="private" checked> Özel (Kodlu)</label>
                <label><input type="radio" name="room-type" value="community"> Topluluk (Herkese Açık)</label>
            </div>
            
            <input type="password" id="input-room-pass" placeholder="Şifre (İsteğe Bağlı - Sadece Topluluk)" style="display:none;">

            <div class="modal-actions">
                <button class="btn-cancel" id="btn-cancel-create">İptal</button>
                <button class="btn-confirm" id="btn-confirm-create">Oluştur</button>
            </div>
        </div>
    </div>

    <!-- 4. LOBİ / TAKIM SEÇİMİ -->
    <div id="screen-lobby" class="screen">
        <div class="lobby-header">
            <h2 id="lobby-room-name">Oda Adı</h2>
            <div class="room-code" id="lobby-room-code" style="display:none;">KOD: ---</div>
        </div>
        
        <div class="teams-container">
            <div class="team-box red" onclick="selectTeam('red')">
                <div class="team-title" style="color:#ff4c4c;">KIRMIZI TAKIM</div>
                <div id="red-players"></div>
            </div>
            <div class="team-box blue" onclick="selectTeam('blue')">
                <div class="team-title" style="color:#4c9aff;">MAVİ TAKIM</div>
                <div id="blue-players"></div>
            </div>
            <div class="team-box spectator" onclick="selectTeam('spectator')">
                <div class="team-title" style="color:#64748b;">İZLEYİCİ</div>
                <div id="spec-players"></div>
            </div>
        </div>

        <button class="start-game-btn" id="btn-start-game">OYUNU BAŞLAT</button>
        <button class="menu-btn" style="margin-top:20px; width:200px; padding:10px; font-size:14px;" onclick="leaveRoom()">Odadan Ayrıl</button>
    </div>

    <!-- 5. OYUN EKRANI -->
    <div id="screen-game" class="screen">
        <div id="in-game-menu-btn" onclick="goToLobby()">
            <span style="font-size: 24px;">🏠</span> Lobi
        </div>

        <div class="ui-bars">
            <div id="stamina-container">
                <div id="stamina-bar"></div>
                <div id="stamina-text">DEPAR KONDİSYONU</div>
            </div>
            <div id="power-container">
                <div id="power-bar"></div>
                <div id="power-text">ŞUT GÜCÜ</div>
            </div>
        </div>

        <div id="scoreboard">
            <span class="red-team">KIRMIZI <span id="score-red">0</span></span> 
            <span style="color:#64748b">:</span> 
            <span class="blue-team"><span id="score-blue">0</span> MAVİ</span>
        </div>
        
        <canvas id="gameCanvas" width="1200" height="600"></canvas>

        <div id="joystick-zone"><div id="joystick-knob"></div></div>

        <div id="pc-controls">
            <div class="key-row"><div class="key" id="key-w">W</div></div>
            <div class="key-row"><div class="key" id="key-a">A</div><div class="key" id="key-s">S</div><div class="key" id="key-d">D</div></div>
            <div class="key-row">
                <div class="key wide-key" id="key-space">SPACE</div>
                <div class="key" id="key-f">F</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        let currentRoom = null;
        let myTeam = "spectator";
        let serverListData = [];
        
        // Oyun Değişkenleri
        let myPlayer = null;
        let players = {};
        let ball = { x: 600, y: 300, z: 0, owner: null, possessionTimer: 0 };
        let score = { red: 0, blue: 0 };
        let isSpectator = true;

        let stamina = 100;
        let isExhausted = false; 
        const maxStamina = 100;
        const normalSpeed = 4.5;
        const sprintSpeed = 7.5;

        let isCharging = false;
        let shotPower = 0;
        let chargeStartTime = 0;
        let moveX = 0, moveY = 0;

        let ballRotation = 0;
        let ballTrail = [];

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, ' ': false, 'f': false };

        // --- EKRAN GEÇİŞLERİ ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- MENÜ OLAYLARI ---
        document.getElementById('btn-play').onclick = () => {
            switchScreen('screen-server-list');
            socket.emit('get_servers');
        };
        
        document.getElementById('btn-exit').onclick = () => {
            window.location.href = "about:blank";
        };

        // --- SUNUCU OLUŞTURMA OLAYLARI ---
        document.getElementById('btn-show-create').onclick = () => {
            document.getElementById('modal-create').style.display = 'flex';
        };
        
        document.getElementById('btn-cancel-create').onclick = () => {
            document.getElementById('modal-create').style.display = 'none';
        };

        // Radyo butonuna göre şifre kutusunu göster/gizle
        document.querySelectorAll('input[name="room-type"]').forEach(radio => {
            radio.onchange = (e) => {
                let passInput = document.getElementById('input-room-pass');
                if (e.target.value === 'community') passInput.style.display = 'block';
                else passInput.style.display = 'none';
            };
        });

        document.getElementById('btn-confirm-create').onclick = () => {
            let name = document.getElementById('input-room-name').value || "Oda";
            let type = document.querySelector('input[name="room-type"]:checked').value;
            let pass = document.getElementById('input-room-pass').value;
            
            socket.emit('create_server', { name, type, password: pass });
            document.getElementById('modal-create').style.display = 'none';
        };

        // --- SOCKET OLAYLARI ---
        socket.on('server_list', (list) => {
            serverListData = list;
            let container = document.getElementById('server-list-container');
            container.innerHTML = "";
            if (list.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#64748b;'>Henüz açılmış bir oda yok. Hemen bir tane oluştur!</p>";
                return;
            }
            list.forEach(srv => {
                let typeStr = srv.type === 'private' ? '🔒 Özel' : (srv.hasPassword ? '🔑 Şifreli Topluluk' : '🌐 Topluluk');
                let div = document.createElement('div');
                div.className = 'server-item';
                div.innerHTML = `
                    <div>
                        <h3 style="margin:0;">${srv.name} <span style="font-size:12px; color:#64748b;">(${srv.playerCount}/10)</span></h3>
                        <span style="font-size:12px;">${typeStr}</span>
                    </div>
                    <button class="join-btn" onclick="joinRoom('${srv.id}')">Katıl</button>
                `;
                container.appendChild(div);
            });
        });

        window.joinRoom = (id) => {
            let srv = serverListData.find(s => s.id === id);
            let pass = "";
            if (srv.hasPassword) {
                pass = prompt("Bu oda şifreli. Lütfen şifreyi girin:");
                if (pass === null) return; // İptal etti
            }
            socket.emit('join_server', { id: id, password: pass });
        };

        socket.on('join_error', (msg) => { alert(msg); });

        socket.on('server_created', (room) => {
            currentRoom = room;
            myTeam = "spectator"; // Host başlangıçta izleyici
            showLobby(room);
        });

        socket.on('joined_successfully', (room) => {
            currentRoom = room;
            showLobby(room);
        });

        function showLobby(room) {
            switchScreen('screen-lobby');
            document.getElementById('lobby-room-name').innerText = room.name;
            
            if (room.type === 'private') {
                let codeEl = document.getElementById('lobby-room-code');
                codeEl.innerText = "ODA KODU: " + room.id;
                codeEl.style.display = 'block';
            } else {
                document.getElementById('lobby-room-code').style.display = 'none';
            }

            // Eğer ben host isem başlat butonunu göster
            if (room.hostId === socket.id) {
                document.getElementById('btn-start-game').style.display = 'block';
            } else {
                document.getElementById('btn-start-game').style.display = 'none';
            }
        }

        socket.on('update_lobby', (room) => {
            currentRoom = room;
            if (room.status === 'lobby') {
                // Takımları listele
                let redList = document.getElementById('red-players');
                let blueList = document.getElementById('blue-players');
                let specList = document.getElementById('spec-players');
                redList.innerHTML = ""; blueList.innerHTML = ""; specList.innerHTML = "";

                room.players.forEach(p => {
                    let el = `<div class="player-slot">${p.name}</div>`;
                    if (p.team === 'red') redList.innerHTML += el;
                    else if (p.team === 'blue') blueList.innerHTML += el;
                    else specList.innerHTML += el;
                    
                    if (p.id === socket.id) myTeam = p.team;
                });
            }
        });

        window.selectTeam = (team) => {
            if (!currentRoom || currentRoom.status !== 'lobby') return;
            socket.emit('change_team', team);
        };

        document.getElementById('btn-start-game').onclick = () => {
            socket.emit('start_game');
        };

        socket.on('start_error', (msg) => { alert(msg); });

        socket.on('game_started', () => {
            switchScreen('screen-game');
            isSpectator = (myTeam === 'spectator');
        });

        function leaveRoom() {
            if (confirm("Odadan ayrılmak istiyor musunuz?")) {
                window.location.reload(); // Basit çözüm: Sayfayı yenile
            }
        }

        function goToLobby() {
            // Oyun içinden lobiye dönüş
            if (currentRoom && currentRoom.status === 'playing') {
                alert("Maç devam ederken lobiye dönemezsiniz!");
            } else {
                switchScreen('screen-lobby');
            }
        }

        // --- OYUN DÖNGÜSÜ (Güncellenmiş Client) ---
        socket.on('game_state', (room) => {
            if (room.status !== 'playing') return;
            
            players = {};
            room.players.forEach(p => { players[p.id] = p; });
            ball = room.ball;
            score = room.score;
            
            myPlayer = players[socket.id];

            document.getElementById('score-red').innerText = score.red;
            document.getElementById('score-blue').innerText = score.blue;
            
            if (isSpectator) {
                // İzleyici UI gizle
                document.getElementById('stamina-container').style.display = 'none';
            } else {
                document.getElementById('stamina-container').style.display = 'flex';
            }
        });

        // --- KLAVYE VE KONTROLLER ---
        window.addEventListener('keydown', (e) => { 
            if (isSpectator) return;
            let k = e.key === ' ' ? ' ' : e.key.toLowerCase();
            if (keys[k] !== undefined) keys[k] = true;
            
            if (k === ' ') {
                if (ball.owner === socket.id) {
                    isCharging = true;
                    chargeStartTime = Date.now();
                }
            }
            updateKeyVisual(k, true);
        });

        window.addEventListener('keyup', (e) => { 
            if (isSpectator) return;
            let k = e.key === ' ' ? ' ' : e.key.toLowerCase();
            if (keys[k] !== undefined) keys[k] = false;

            if (k === ' ' && isCharging) {
                isCharging = false;
                let pressDuration = Date.now() - chargeStartTime;
                if (pressDuration < 200 && shotPower < 30) forcePass();
                else executeKick();
            }
            updateKeyVisual(k, false);
        });

        function updateKeyVisual(key, isPressed) {
            let id = '';
            if(['w','a','s','d','f'].includes(key)) id = `key-${key}`;
            if(key === ' ') id = 'key-space';
            if(id) {
                const el = document.getElementById(id);
                if(el) {
                    if (id === 'key-f' && isExhausted && isPressed) return;
                    isPressed ? el.classList.add('active') : el.classList.remove('active');
                }
            }
        }

        function getKickAngle() {
            if (moveX !== 0 || moveY !== 0) return Math.atan2(moveY, moveX);
            else if (myPlayer.lastDx !== 0 || myPlayer.lastDy !== 0) return Math.atan2(myPlayer.lastDy, myPlayer.lastDx);
            return 0;
        }

        function forcePass() {
            if (ball.owner !== socket.id) return;
            let angle = getKickAngle();
            socket.emit('kick', { vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15, vz: 0, shotPower: 0 });
            shotPower = 0;
            document.getElementById('power-container').style.display = 'none';
        }

        function executeKick() {
            if (ball.owner !== socket.id) return;
            let angle = getKickAngle();
            let force = shotPower / 100; 
            let speed = 8 + (force * 27);
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed;
            let vz = 2 + (force * 8);
            
            socket.emit('kick', { vx: vx, vy: vy, vz: vz, shotPower: shotPower });
            shotPower = 0;
            document.getElementById('power-container').style.display = 'none';
        }

        // Mobil Joystick
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false, joystickVector = { x: 0, y: 0 }, maxDistance = 50;

        function handleTouch(e) {
            if (isSpectator) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const distance = Math.sqrt(dx*dx + dy*dy);
            if (distance > maxDistance) { dx = (dx / distance) * maxDistance; dy = (dy / distance) * maxDistance; }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickVector.x = dx / maxDistance;
            joystickVector.y = dy / maxDistance;
        }

        joystickZone.addEventListener('touchstart', (e) => { joystickActive = true; handleTouch(e); });
        joystickZone.addEventListener('touchmove', (e) => { if(joystickActive) handleTouch(e); });
        joystickZone.addEventListener('touchend', () => {
            joystickActive = false; joystickKnob.style.transform = 'translate(-50%, -50%)'; joystickVector = { x: 0, y: 0 };
        });

        // --- HAREKET DÖNGÜSÜ ---
        function updateMovement() {
            if (isSpectator || !myPlayer || !currentRoom || currentRoom.status !== 'playing') { 
                requestAnimationFrame(updateMovement); 
                return; 
            }

            let isSprinting = false;
            let currentSpeed = normalSpeed;

            if (isExhausted) {
                stamina += 0.15;
                if (stamina >= 30) isExhausted = false;
            } else {
                if (keys['f']) {
                    isSprinting = true;
                    currentSpeed = sprintSpeed;
                    stamina -= 1.2;
                    if (stamina <= 0) { stamina = 0; isExhausted = true; }
                } else {
                    stamina += 0.15;
                }
            }
            if (stamina > maxStamina) stamina = maxStamina;

            const bar = document.getElementById('stamina-bar');
            if(bar) {
                bar.style.width = (stamina / maxStamina) * 100 + '%';
                if (isExhausted) bar.style.background = 'linear-gradient(90deg, #ef4444, #7f1d1d)';
                else if (stamina < 30) bar.style.background = 'linear-gradient(90deg, #f97316, #ea580c)';
                else bar.style.background = 'linear-gradient(90deg, #22c55e, #eab308)';
            }

            if (isCharging && ball.owner === socket.id) {
                document.getElementById('power-container').style.display = 'flex'; 
                shotPower += 3.5;
                if (shotPower > 100) shotPower = 100;
                const pBar = document.getElementById('power-bar');
                pBar.style.width = shotPower + '%';
                if (shotPower < 38) pBar.style.background = '#ef4444'; 
                else pBar.style.background = `linear-gradient(90deg, #22c55e ${shotPower}%, #eab308)`; 
            } else if (!isCharging) {
                document.getElementById('power-container').style.display = 'none';
                shotPower = 0;
            }

            let dx = 0, dy = 0;
            if (keys.w || keys.ArrowUp) dy -= 1;
            if (keys.s || keys.ArrowDown) dy += 1;
            if (keys.a || keys.ArrowLeft) dx -= 1;
            if (keys.d || keys.ArrowRight) dx += 1;
            if (joystickActive) { dx += joystickVector.x; dy += joystickVector.y; }

            if (dx !== 0 || dy !== 0) {
                let length = Math.hypot(dx, dy);
                let speedMultiplier = isCharging ? 0.5 : 1;
                dx = (dx / length) * (currentSpeed * speedMultiplier);
                dy = (dy / length) * (currentSpeed * speedMultiplier);
                myPlayer.lastDx = dx; myPlayer.lastDy = dy;
            }
            moveX = dx; moveY = dy;

            myPlayer.x = Math.max(25, Math.min(1200 - 25, myPlayer.x + dx));
            myPlayer.y = Math.max(25, Math.min(600 - 25, myPlayer.y + dy));
            socket.emit('move', { x: myPlayer.x, y: myPlayer.y });

            requestAnimationFrame(updateMovement);
        }

        // --- ÇİZİM DÖNGÜSÜ ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function drawPitch() {
            const stripeWidth = canvas.width / 16;
            for (let i = 0; i < 16; i++) {
                ctx.fillStyle = (i % 2 === 0) ? '#2e7d32' : '#388e3c'; 
                ctx.fillRect(i * stripeWidth, 0, stripeWidth, canvas.height);
            }
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const margin = 30;
            ctx.strokeRect(margin, margin, canvas.width - (margin * 2), canvas.height - (margin * 2));
            ctx.beginPath(); ctx.moveTo(canvas.width / 2, margin); ctx.lineTo(canvas.width / 2, canvas.height - margin); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill();
            const penaltyW = 160, penaltyH = 260, penaltyY = (canvas.height - penaltyH) / 2;
            ctx.strokeRect(margin, penaltyY, penaltyW, penaltyH); ctx.strokeRect(canvas.width - margin - penaltyW, penaltyY, penaltyW, penaltyH);
            const goalAreaW = 60, goalAreaH = 120, goalAreaY = (canvas.height - goalAreaH) / 2;
            ctx.strokeRect(margin, goalAreaY, goalAreaW, goalAreaH); ctx.strokeRect(canvas.width - margin - goalAreaW, goalAreaY, goalAreaW, goalAreaH);
            ctx.beginPath(); ctx.arc(margin + 110, canvas.height / 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width - margin - 110, canvas.height / 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(margin + penaltyW, canvas.height / 2, 50, Math.PI * 0.65, Math.PI * 1.35); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width - margin - penaltyW, canvas.height / 2, 50, -Math.PI * 0.35, Math.PI * 0.35); ctx.stroke();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(margin - 10, canvas.height / 2 - 100, 10, 200); ctx.fillRect(canvas.width - margin, canvas.height / 2 - 100, 10, 200);
        }

        function drawBall() {
            let drawY = ball.y - (ball.z || 0);
            let shadowScale = Math.max(0.3, 1 - (ball.z / 150)); 
            ctx.beginPath(); ctx.ellipse(ball.x, ball.y, 15 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 0, 0, ${0.4 * shadowScale})`; ctx.fill();

            let speed = Math.hypot(ball.vx || 0, ball.vy || 0);
            if (speed > 5 && ball.z === 0) ballTrail.push({ x: ball.x, y: drawY, alpha: 0.5 });
            if (ballTrail.length > 8) ballTrail.shift();
            for (let i = 0; i < ballTrail.length; i++) {
                let t = ballTrail[i]; t.alpha -= 0.05;
                if (t.alpha > 0) {
                    ctx.beginPath(); ctx.arc(t.x, t.y, 15, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${t.alpha})`; ctx.fill();
                }
            }

            ballRotation += speed * 0.05;
            ctx.save(); ctx.translate(ball.x, drawY); ctx.rotate(ballRotation);
            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#1a1a1a'; ctx.stroke();
            function drawPentagon(radius, offsetX, offsetY, angle) {
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    let a = angle + i * (Math.PI * 2 / 5);
                    let x = offsetX + Math.cos(a) * radius; let y = offsetY + Math.sin(a) * radius;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath(); ctx.fillStyle = '#1a1a1a'; ctx.fill();
            }
            drawPentagon(5.5, 0, 0, 0); drawPentagon(4, 10, 0, 0.5); drawPentagon(4, -10, 0, 1.5); drawPentagon(4, 0, 10, 0.8); drawPentagon(4, 0, -10, 1.2);
            ctx.restore();
        }

        function gameLoop() {
            if (document.getElementById('screen-game').classList.contains('active')) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPitch();
                drawBall();

                for (let id in players) {
                    let p = players[id];
                    if (!p || p.team === 'spectator') continue;
                    
                    ctx.beginPath(); ctx.arc(p.x, p.y + 5, 22, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
                    ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
                    
                    // YENİ FORMA RENKLERİ
                    if (p.team === 'red') {
                        // Kırmızı - Siyah
                        ctx.fillStyle = '#ff0000'; // Ana kırmızı
                    } else {
                        // Mavi - Gri
                        ctx.fillStyle = '#1e90ff'; // Ana mavi
                    }
                    ctx.fill(); 
                    
                    ctx.strokeStyle = p.team === 'red' ? '#000000' : '#cccccc'; // Kenarlık (Siyah veya Gri)
                    ctx.lineWidth = 4; 
                    ctx.stroke();
                    
                    if (id === ball.owner) {
                        let time = Date.now(); let pulse = (Math.sin(time / 80) + 1) / 2; let radius = 26 + (pulse * 8); 
                        ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(57, 255, 20, ${0.6 + (pulse * 0.4)})`; ctx.lineWidth = 5;
                        ctx.shadowColor = '#39FF14'; ctx.shadowBlur = 15 + (pulse * 15); ctx.stroke(); ctx.restore();
                    }

                    if (id === socket.id && isCharging && shotPower >= 38) {
                        let intensity = shotPower / 100; let time = Date.now() / 100;
                        ctx.beginPath(); ctx.arc(p.x, p.y, 35 + (intensity * 20), 0, Math.PI * 2); ctx.fillStyle = `rgba(88, 28, 135, ${intensity * 0.4})`; ctx.fill();
                        for (let i = 0; i < 5; i++) {
                            let angle = time + (i * Math.PI * 2 / 5); let rad1 = 25; let rad2 = 45 + (intensity * 15);
                            ctx.beginPath(); ctx.moveTo(p.x + Math.cos(angle) * rad1, p.y + Math.sin(angle) * rad1);
                            let midAngle = angle + (Math.random() - 0.5) * 0.5;
                            ctx.lineTo(p.x + Math.cos(midAngle) * (rad1+rad2)/2, p.y + Math.sin(midAngle) * (rad1+rad2)/2);
                            ctx.lineTo(p.x + Math.cos(angle) * rad2, p.y + Math.sin(angle) * rad2);
                            ctx.strokeStyle = `rgba(168, 85, 247, ${intensity})`; ctx.lineWidth = 3; ctx.stroke();
                        }
                    }
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.fillText(p.name, p.x, p.y - 35);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        updateMovement();
        gameLoop();
    </script>
</body>
