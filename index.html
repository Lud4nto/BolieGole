<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Critiball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #scoreboard {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px #000;
        }
        .red-team { color: #ff4c4c; }
        .blue-team { color: #4c9aff; }
        
        canvas {
            /* Daha yatay bir görünüm için genişlik artırıldı */
            width: 90vw;
            height: 70vh;
            background-color: #2e7d32;
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* Mobil Joystick */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            pointer-events: auto; /* Tıklamayı yakalar */
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        @media (pointer: coarse) {
            #joystick-zone { display: block; }
            canvas { width: 100vw; height: 100vh; border-radius: 0; border: none; }
            #scoreboard { position: absolute; top: 20px; z-index: 10; }
        }

        /* PC Kontrol Görselleri */
        #pc-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            pointer-events: none; /* Tıklamaları engellemez */
        }
        .key-row {
            display: flex;
            gap: 8px;
        }
        .key {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #ccc;
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .key.active {
            background: #4c9aff;
            color: white;
            border-color: #ffffff;
            transform: translateY(4px);
            box-shadow: 0 0 15px #4c9aff;
        }
        .wide-key {
            width: 122px;
        }
        
        @media (pointer: coarse) {
            #pc-controls { display: none; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="scoreboard">
            <span class="red-team">Kırmızı: <span id="score-red">0</span></span> 
            - 
            <span class="blue-team">Mavi: <span id="score-blue">0</span></span>
        </div>
        
        <!-- Saha boyutu yatay olarak ayarlandı (1200x600) -->
        <canvas id="gameCanvas" width="1200" height="600"></canvas>

        <!-- Mobil Kontroller -->
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>

        <!-- PC Kontrolleri Görseli -->
        <div id="pc-controls">
            <div class="key-row">
                <div class="key" id="key-w">W</div>
            </div>
            <div class="key-row">
                <div class="key" id="key-a">A</div>
                <div class="key" id="key-s">S</div>
                <div class="key" id="key-d">D</div>
            </div>
            <div class="key-row" style="margin-top: 10px;">
                <div class="key wide-key" id="key-space">SPACE</div>
            </div>
            <div class="key-row">
                <div class="key wide-key" id="key-control">CTRL</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const socket = io();

        const bgImage = new Image();
        bgImage.src = 'arkaplan.png';

        let myPlayer = null;
        let players = {};
        let ball = { x: 600, y: 300 };
        let score = { red: 0, blue: 0 };

        // Tuş durumları
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false, ' ': false, 'Control': false };
        
        // Tuş dinleyicileri (Hem büyük hem küçük harf duyarlı)
        window.addEventListener('keydown', (e) => { 
            let k = e.key;
            if(k === ' ' || k === 'Control' || k === 'ArrowUp' || k === 'ArrowLeft' || k === 'ArrowDown' || k === 'ArrowRight') {
                if (keys[k] !== undefined) keys[k] = true;
                updateKeyVisual(k, true);
            } else {
                k = k.toLowerCase();
                if (keys[k] !== undefined) keys[k] = true;
                updateKeyVisual(k, true);
            }
        });
        
        window.addEventListener('keyup', (e) => { 
            let k = e.key;
            if(k === ' ' || k === 'Control' || k === 'ArrowUp' || k === 'ArrowLeft' || k === 'ArrowDown' || k === 'ArrowRight') {
                if (keys[k] !== undefined) keys[k] = false;
                updateKeyVisual(k, false);
            } else {
                k = k.toLowerCase();
                if (keys[k] !== undefined) keys[k] = false;
                updateKeyVisual(k, false);
            }
        });

        function updateKeyVisual(key, isPressed) {
            let id = '';
            if(key === 'w' || key === 'a' || key === 's' || key === 'd') id = `key-${key}`;
            if(key === ' ') id = 'key-space';
            if(key === 'Control') id = 'key-control';
            
            if(id) {
                const el = document.getElementById(id);
                if(el) {
                    if(isPressed) el.classList.add('active');
                    else el.classList.remove('active');
                }
            }
        }

        // Joystick Ayarları
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        const maxDistance = 50;

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (distance > maxDistance) {
                dx = (dx / distance) * maxDistance;
                dy = (dy / distance) * maxDistance;
            }

            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickVector.x = dx / maxDistance;
            joystickVector.y = dy / maxDistance;
        }

        joystickZone.addEventListener('touchstart', (e) => { joystickActive = true; handleTouch(e); });
        joystickZone.addEventListener('touchmove', (e) => { if(joystickActive) handleTouch(e); });
        joystickZone.addEventListener('touchend', (e) => {
            joystickActive = false;
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            joystickVector = { x: 0, y: 0 };
        });

        // Socket Bağlantıları
        socket.on('currentPlayers', (p, b, s) => {
            players = p; ball = b; score = s; 
            if (players[socket.id]) myPlayer = players[socket.id];
        });
        
        socket.on('newPlayer', (player) => { players[player.id] = player; });
        socket.on('playerDisconnected', (id) => { delete players[id]; });
        
        socket.on('gameState', (p, b, s) => {
            players = p; ball = b; score = s;
            // KRİTİK DÜZELTME: Oyuncu referansını her karede güncelle
            if (players[socket.id]) myPlayer = players[socket.id];
            
            document.getElementById('score-red').innerText = score.red;
            document.getElementById('score-blue').innerText = score.blue;
            draw();
        });

        let isDashing = false;
        let dashCooldown = 0;

        function updateMovement() {
            if (!myPlayer) {
                requestAnimationFrame(updateMovement);
                return;
            }

            let speed = 6;
            let dx = 0;
            let dy = 0;

            if (keys.w || keys.ArrowUp) dy -= speed;
            if (keys.s || keys.ArrowDown) dy += speed;
            if (keys.a || keys.ArrowLeft) dx -= speed;
            if (keys.d || keys.ArrowRight) dx += speed;

            if (joystickActive) {
                dx += joystickVector.x * speed;
                dy += joystickVector.y * speed;
            }

            if (keys['Control'] && dashCooldown <= 0) {
                isDashing = true;
                dashCooldown = 120;
                if(dx === 0 && dy === 0) { dx = 0; dy = speed * 2; }
                else { dx *= 2; dy *= 2; }
                
                setTimeout(() => { isDashing = false; }, 300);
            }
            if (dashCooldown > 0) dashCooldown--;

            let newX = Math.max(20, Math.min(canvas.width - 20, myPlayer.x + dx));
            let newY = Math.max(20, Math.min(canvas.height - 20, myPlayer.y + dy));

            if (newX !== myPlayer.x || newY !== myPlayer.y) {
                myPlayer.x = newX;
                myPlayer.y = newY;
                socket.emit('move', { x: newX, y: newY });

                let distToBall = Math.hypot(myPlayer.x - ball.x, myPlayer.y - ball.y);
                let kickRadius = isDashing ? 50 : 35;

                if (distToBall < kickRadius) {
                    let kickPower = keys[' '] ? 4 : 2; 
                    socket.emit('kick', { 
                        vx: (ball.x - myPlayer.x) * kickPower, 
                        vy: (ball.y - myPlayer.y) * kickPower 
                    });
                }
            }

            requestAnimationFrame(updateMovement);
        }

        // Resmi esnetmeden sahayı kaplama (Cover)
        function drawCoverImage(img, canvas) {
            if (!img.complete || img.naturalWidth === 0) return false;
            
            const imgRatio = img.width / img.height;
            const canvasRatio = canvas.width / canvas.height;
            let drawWidth, drawHeight, offsetX, offsetY;

            if (canvasRatio > imgRatio) {
                drawWidth = canvas.width;
                drawHeight = canvas.width / imgRatio;
                offsetX = 0;
                offsetY = (canvas.height - drawHeight) / 2;
            } else {
                drawWidth = canvas.height * imgRatio;
                drawHeight = canvas.height;
                offsetX = (canvas.width - drawWidth) / 2;
                offsetY = 0;
            }
            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
            return true;
        }

        function draw() {
            if (!drawCoverImage(bgImage, canvas)) {
                ctx.fillStyle = '#2e7d32';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Saha Çizgileri
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 90, 0, Math.PI * 2);
            ctx.stroke();

            // Kaleler
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            let goalHeight = 200;
            let goalY = (canvas.height - goalHeight) / 2;
            ctx.fillRect(0, goalY, 15, goalHeight);
            ctx.fillRect(canvas.width - 15, goalY, 15, goalHeight);

            // Topu Çiz
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Oyuncuları Çiz
            for (let id in players) {
                let p = players[id];
                
                if (id === socket.id && isDashing) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 30, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
                ctx.fillStyle = p.team === 'red' ? '#ff4c4c' : '#4c9aff';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 35);
            }
        }

        updateMovement();
        draw();
    </script>
</body>
</html>
